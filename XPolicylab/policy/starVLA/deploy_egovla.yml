policy_name: starVLA
protocol: ws
bench_name: null
task_name: null
env_cfg_type: ego_h1_inspire
action_type: joint
gpu_id: null
seed: null
eval_batch: true

# XPolicyLab model server
host: localhost
port: 6000

# Upstream StarVLA runtime
starvla_root: source_starvla
checkpoint_path: null
starvla_server_host: 127.0.0.1
starvla_server_port: 5694
unnorm_key: auto
use_ddim: true
num_ddim_steps: 10
image_size: [224, 224]
execute_horizon: 16
include_state: auto
require_runtime_contract: true
required_pi_v3_forward: null

# The model keeps three visual slots. EgoVLA supplies only cam_head, so both
# wrist slots are forced to uint8 RGB black images at image_size.
camera_names: [cam_head, cam_left_wrist, cam_right_wrist]
black_camera_names: [cam_left_wrist, cam_right_wrist]
